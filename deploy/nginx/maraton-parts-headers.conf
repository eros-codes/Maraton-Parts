# Security headers, included explicitly in every location below.
#
# nginx has a trap here: a location that sets any add_header of its own
# inherits *none* of the add_header lines from the server level. Since most
# locations set Cache-Control, headers declared once at the top silently
# vanished from almost every response - including the panel's noindex.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# What the two apps may load. Code, styles, fonts and API calls only from
# this host. Pictures and videos over https from anywhere: product images
# are addressed through BACKEND_URL, which for the panel is the store's
# host, and the eNamad seal is on its own. No inline script anywhere (Vite
# emits none);
# inline *styles* are allowed because React's style={...} needs them. blob:
# is the panel's preview of a picked photo or video before upload. Payment
# leaves by a full-page redirect to ZarinPal, which CSP does not restrict.
# If you ever build the apps with VITE_API_URL pointing at another host,
# add that host to connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests" always;
# Browser features neither app uses.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Only takes effect over HTTPS; browsers ignore it on plain HTTP. Scoped to
# this host - no includeSubDomains - so it never touches aboutarvin.ir.
add_header Strict-Transport-Security "max-age=31536000" always;
# Empty for the store, "noindex, nofollow" for the panel (see the map in
# maraton-parts.conf). nginx sends no header at all for an empty value.
add_header X-Robots-Tag $maraton_parts_robots always;
